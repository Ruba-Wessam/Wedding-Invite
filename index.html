<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دعوة زفاف | Wedding invitation</title>
<meta property="og:title" content="دعوة زفاف | Wedding invitation">
<meta property="og:description" content="اضغط لتأكيد الحضور | Tap to RSVP">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#EDF0EC; --card:#FFFFFF; --ink:#2A1B2D; --muted:#6B626E; --line:#D7DBD3;
  --gold:#9A7330; --gold-soft:#EFE5D2; --rose:#A9707A; --rose-soft:#F4E6E8;
  --ok:#2E6A4E; --ok-soft:#E1EFE7; --amber:#8E6410; --amber-soft:#F6ECD6;
  --bad:#963B3B; --bad-soft:#F5E3E3; --slate:#45577A; --slate-soft:#E3E8F1;
  --grey-soft:#E7E8E4;
  --display:"Amiri", "Times New Roman", serif;
  --ui:"IBM Plex Sans Arabic", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1420; --card:#251C2A; --ink:#F0E8EE; --muted:#B4A9B6; --line:#3B3040;
    --gold:#D4B06C; --gold-soft:#3A3122; --rose:#D79AA4; --rose-soft:#3C2730;
    --ok:#7CC7A0; --ok-soft:#1F3A2D; --amber:#E2B65C; --amber-soft:#3A2F17;
    --bad:#E59A9A; --bad-soft:#402426; --slate:#A9B9DA; --slate-soft:#283247; --grey-soft:#302835;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1420; --card:#251C2A; --ink:#F0E8EE; --muted:#B4A9B6; --line:#3B3040;
  --gold:#D4B06C; --gold-soft:#3A3122; --rose:#D79AA4; --rose-soft:#3C2730;
  --ok:#7CC7A0; --ok-soft:#1F3A2D; --amber:#E2B65C; --amber-soft:#3A2F17;
  --bad:#E59A9A; --bad-soft:#402426; --slate:#A9B9DA; --slate-soft:#283247; --grey-soft:#302835;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
img,svg,canvas,video{max-width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 64px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap;min-height:42px}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--grey-soft)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px}
.btn.icon{padding:0;width:40px;min-height:40px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin:0;flex:1;min-width:200px}
.top h1 small{display:block;font-family:var(--ui);font-size:14px;font-weight:400;color:var(--muted);margin-top:2px}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}

.notice{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:15px}
.notice.gold{background:var(--gold-soft);border-color:transparent}

/* overview */
.overview{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.seatline{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px}
.seatline div{min-width:120px}
.seatline b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;font-weight:700}
.seatline span{font-size:14px;color:var(--muted)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--grey-soft);margin-bottom:14px}
.bar i{display:block;height:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip em{font-style:normal;opacity:.7}

.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;padding-inline-start:38px;min-height:42px}
.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* list */
.list{background:var(--card);border:1px solid var(--line);border-radius:16px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 170px auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .who b{font-weight:600;display:block;overflow-wrap:anywhere}
.row .who span{font-size:13px;color:var(--muted)}
.row .seats{font-variant-numeric:tabular-nums;font-size:15px}
.row .seats small{color:var(--muted)}
.row .acts{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap}
.pill.draft{background:var(--grey-soft);color:var(--muted)}
.pill.sent{background:var(--slate-soft);color:var(--slate)}
.pill.viewed{background:var(--rose-soft);color:var(--rose)}
.pill.confirmed{background:var(--ok-soft);color:var(--ok)}
.pill.partial{background:var(--amber-soft);color:var(--amber)}
.pill.declined{background:var(--bad-soft);color:var(--bad)}
.pill.checkedin{background:var(--gold);color:#fff}
.empty{padding:48px 20px;text-align:center}
.empty h2{font-family:var(--display);font-size:26px;margin:0 0 6px}
.empty p{margin:0 auto 18px;max-width:44ch;color:var(--muted)}
@media (max-width:720px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who status" "seats acts"}
  .row .who{grid-area:who}.row .st{grid-area:status;justify-self:end}
  .row .seats{grid-area:seats}.row .acts{grid-area:acts}
  .row .acts .lbl{display:none}
}

/* menu */
details.menu{position:relative}
details.menu summary{list-style:none}
details.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 12px 32px rgba(30,15,35,.16)}
.menu-pop button,.menu-pop a{display:flex;color:inherit;text-decoration:none;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:start;font-size:15px}
.menu-pop button:hover,.menu-pop a:hover{background:var(--grey-soft)}
.menu-pop button svg,.menu-pop a svg{width:17px;height:17px;color:var(--muted)}
.menu-pop button.danger{color:var(--bad)}
.menu-pop button.danger svg{color:var(--bad)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(520px,calc(100% - 24px));max-height:calc(100% - 48px)}
dialog::backdrop{background:rgba(25,12,30,.45)}
.dlg{padding:22px}
.dlg h2{font-family:var(--display);font-size:26px;margin:0 0 14px;line-height:1.2}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;font-weight:500;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.dlg-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;cursor:pointer;display:block}
.drop:hover{border-color:var(--gold)}
.q-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;background:var(--bg)}
.q-card b{font-family:var(--display);font-size:24px;display:block;line-height:1.2}
.q-prog{height:6px;border-radius:99px;background:var(--grey-soft);overflow:hidden;margin-bottom:6px}
.q-prog i{display:block;height:100%;background:var(--gold)}
.q-msg{white-space:pre-wrap;font-size:13px;color:var(--muted);max-height:140px;overflow:auto;margin-top:8px}
.wa-btn.cooling{opacity:.55;pointer-events:none;filter:saturate(.4)}
.wa-btn{background:#1F8F55;border-color:#1F8F55;color:#fff;width:100%;min-height:56px;font-size:17px;border-radius:14px}
.report{font-size:14px;max-height:160px;overflow:auto;margin:10px 0;color:var(--muted)}

.rpop{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,8,16,.18);opacity:0;transition:opacity .3s}
.rpop.on{opacity:1}
.rpop>div{background:var(--card,#FBF6F3);color:#660D23;border:1px solid rgba(102,13,35,.25);border-radius:18px;padding:22px 26px 18px;max-width:320px;text-align:center;box-shadow:0 18px 50px rgba(60,10,20,.25);transform:scale(.92);transition:transform .3s}
.rpop.on>div{transform:none}
.rpop svg{width:52px;height:52px;fill:none;stroke:#660D23;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.rpop p{margin:10px 0 0;font-family:var(--display);font-size:22px;line-height:1.4}
.helper .h-head .inv{margin-bottom:6px}
.h-prog{height:8px;background:rgba(102,13,35,.12);border-radius:8px;overflow:hidden;margin:14px 0 6px}
.h-prog div{height:100%;background:var(--wine,#660D23);transition:width .4s}
.h-count{margin:0;font-size:14px;color:var(--wine,#660D23)}
.h-card .h-lbl{margin:0 0 4px;font-size:14px;opacity:.85}
.h-card .h-name{margin:0 0 4px;font-size:27px;line-height:1.3}
.h-card .h-note{margin:0 0 6px;font-size:16px;color:#F3D9DF!important}
.h-row-no{float:inline-end;font-size:13px;opacity:.85}
.h-rn{display:inline-block;min-width:2.2em;opacity:.6;font-weight:400;font-size:13px}
.h-inote{font-style:normal;color:#F3D9DF;font-size:13px}
.h-card .h-meta{margin:0 0 14px;font-size:14px;opacity:.85}
.h-q{width:100%;min-height:52px;border-radius:12px;border:0;padding:0 14px;font:inherit;font-size:17px;margin:12px 0 8px;background:#FBF6F3;color:#2A1B2D}
.h-hits{display:grid;gap:6px;max-height:360px;overflow:auto;padding:2px}
.h-hit{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;padding:11px 13px;border-radius:12px;border:1px solid rgba(251,246,243,.35);background:rgba(251,246,243,.08);color:inherit;font:inherit;font-size:16px;cursor:pointer}
.h-hit:active{background:rgba(251,246,243,.2)}
.h-hit span{font-size:13px;opacity:.8}
.h-row{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
.h-man{display:flex;gap:8px;margin-top:6px}.h-man input{flex:1;min-width:0;min-height:52px;border-radius:12px;border:0;padding:0 14px;font-size:18px;background:#FBF6F3;color:#2A1B2D}
.h-flash{margin:0 0 12px!important;padding:9px 12px;border-radius:10px;background:rgba(251,246,243,.14);font-size:15px}
.h-flash.bad{background:#FBF6F3;color:#8a1020!important}
.h-link{display:block;margin:10px auto 0}
.h-none{text-align:center;font-size:14px;opacity:.8;margin:6px 0}
.h-tabs{display:flex;gap:6px;margin-bottom:10px}
.h-tabs button{flex:1;min-height:42px;border-radius:10px;border:1px solid rgba(251,246,243,.4);background:transparent;color:#FBF6F3;font:inherit;font-size:15px;cursor:pointer}
.h-tabs button.on{background:#FBF6F3;color:var(--wine,#660D23)}
.h-list{display:grid;gap:4px;max-height:420px;overflow:auto}
.h-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:rgba(251,246,243,.06);color:#FBF6F3;font:inherit;font-size:15px;text-align:start;cursor:pointer}
.h-item.on{outline:2px solid #FBF6F3}
.h-item small{opacity:.75;font-size:13px;white-space:nowrap}
.h-steps{padding-inline-start:22px;margin:6px 0 14px;line-height:1.8;font-size:15px}
.h-file{display:flex;align-items:center;justify-content:center;cursor:pointer}
.h-loaded{text-align:center;font-size:14px;color:var(--wine,#660D23);margin:0 0 12px}
.h-ios summary{cursor:pointer;text-align:center;font-size:14px;color:var(--wine,#660D23);margin:0 0 12px}
details.h-ios[open]{background:linear-gradient(170deg,#741430,#560A1D);color:#FBF6F3;border-radius:18px;padding:14px 16px;margin-bottom:14px}
details.h-ios[open] summary{color:#FBF6F3}
.who-note{display:block;font-style:normal;font-size:14px;color:var(--wine,#660D23);margin:1px 0 2px}
.immap{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0}.immap summary{cursor:pointer;font-weight:600}
.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast div{background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:15px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast div.on{opacity:1;transform:none}

/* ===== guest page ===== */
.guest{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.g-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;min-height:40px}
.arch{position:relative;background:var(--card);border-radius:240px 240px 18px 18px;padding:64px 26px 28px;text-align:center;border:1px solid var(--line)}
.arch::before{content:"";position:absolute;inset:9px;border:1px solid var(--gold);border-radius:232px 232px 12px 12px;pointer-events:none;opacity:.7}
.arch .names{font-family:var(--display);font-size:clamp(30px,8vw,40px);line-height:1.2;margin:0 0 10px;font-weight:700}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:4px 0 16px}
.orn i{display:block;width:56px;height:1px;background:currentColor}
.orn b{width:7px;height:7px;transform:rotate(45deg);border:1px solid currentColor}
.arch .dear{font-family:var(--display);font-size:24px;margin:0 0 4px}
.arch .inv{margin:0 0 18px;color:var(--muted)}
.facts{display:flex;justify-content:center;gap:0;margin:0;border-top:1px solid var(--line);padding-top:16px}
.facts div{flex:1;padding:0 8px}
.facts div+div{border-inline-start:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;font-size:17px}
.map-btn{display:flex;width:100%;margin-top:18px;min-height:58px;border-radius:14px;border-color:var(--gold);gap:12px;font-size:17px;white-space:normal;text-align:start}
.map-btn span:first-child{font-size:22px}
.map-btn small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.cd{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.cd-date{margin:0;font-family:var(--display);font-size:20px}
.cd-hijri{margin:2px 0 12px;font-size:15px;color:var(--gold)}
.cd-label{margin:0 0 10px;font-size:13px;color:var(--muted)}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd-grid div{background:var(--gold-soft);border-radius:12px;padding:10px 4px 8px}
.cd-grid b{display:block;font-family:var(--display);font-size:clamp(26px,7vw,34px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.cd-grid span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.cd-now{margin:0;font-family:var(--display);font-size:24px;color:var(--gold)}
.admin-cd{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.admin-cd .cd{margin:0;padding:0;border:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.admin-cd .cd-dates{flex:1;min-width:200px}
.admin-cd .cd-date{font-size:18px}
.admin-cd .cd-hijri{margin:0}
.admin-cd .cd-label{display:none}
.admin-cd .cd-grid{flex:0 1 340px;gap:6px}
.admin-cd .cd-grid div{padding:7px 4px 6px}
.admin-cd .cd-grid b{font-size:24px}
.g-strip{text-align:center;padding:4px 8px 12px}
.g-strip .names{font-family:var(--display);font-size:24px;font-weight:700;margin:0;line-height:1.25}
.g-strip .dear{margin:2px 0 0;color:var(--muted);font-size:15px}
.entry{text-align:center;padding-top:18px}
.entry .tick{width:44px;height:44px;margin-bottom:4px}
.entry h2{font-family:var(--display);font-size:26px;margin:0;font-weight:700;line-height:1.25}
.entry .ready{margin:2px 0 0;color:var(--gold);font-weight:600}
.entry .qr{width:min(260px,76%);margin:14px auto 10px}
.entry .who{margin:0 0 4px;font-weight:600}
.entry .help{margin:0 0 14px;color:var(--muted);font-size:15px}
.entry .save{width:100%;min-height:54px;font-size:17px;border-radius:14px;margin-bottom:8px}
.entry .look{font-family:var(--display);font-size:19px;margin:14px 0 0}
.below-label{text-align:center;color:var(--muted);font-size:13px;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.below-label::before,.below-label::after{content:"";flex:1;border-top:1px solid var(--line)}
.arch.rect{border-radius:18px;padding-top:28px}
.arch.rect::before{border-radius:12px}
.arch.entry{padding-top:58px;padding-bottom:24px}
.arch.entry .names{font-size:clamp(24px,6.5vw,32px);margin-bottom:6px}
.arch.entry .orn{margin:2px 0 10px}
.arch.entry .dear{font-size:19px;margin:0 0 14px;color:var(--muted)}
.map-btn,.map-btn:visited{color:var(--ink);text-decoration:none}
.cd-top{text-align:center;margin-bottom:14px}
.cd-top .cd{margin:0;padding:0;border:0}
.arch.entry .map-btn{margin-top:14px}
.side-pill{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;margin-inline-start:6px;vertical-align:1px}
.side-pill.bride{background:var(--rose-soft);color:var(--rose)}
.side-pill.groom{background:var(--slate-soft);color:var(--slate)}
.side-pill.none{background:var(--grey-soft);color:var(--muted)}
.sidechips{margin-bottom:10px}
.capgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 14px}
.cap{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cap h3{margin:0 0 6px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.cap h3 em{font-style:normal;color:var(--muted);font-weight:500}
.capbar{height:8px;border-radius:99px;background:var(--grey-soft);overflow:hidden;position:relative;margin-bottom:6px}
.capbar i{position:absolute;inset-block:0;inset-inline-start:0;display:block}
.capbar .r{background:var(--gold-soft);border-inline-end:2px solid var(--gold)}
.capbar .c{background:var(--ok)}
.capbar.over .r{background:var(--bad-soft);border-color:var(--bad)}
.cap p{margin:0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.cap p b{color:var(--ink);font-weight:600}
.sidetbl{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 14px}
.sidetbl th,.sidetbl td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.sidetbl th:first-child,.sidetbl td:first-child{text-align:start}
.sidetbl th{font-weight:500;color:var(--muted);font-size:13px}
.tblwrap{overflow-x:auto}
.seg{display:flex;gap:8px;margin:0 0 12px}
.seg label{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.assign{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.side-btn{min-height:32px;padding:4px 12px}
.side-btn.bride{border-color:var(--rose);color:var(--rose)}
.side-btn.groom{border-color:var(--slate);color:var(--slate)}
.g-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px}
.g-card h2{font-size:18px;font-weight:600;margin:0 0 14px;line-height:1.4}
.choice{display:grid;gap:10px}
.g-back{display:block;margin:14px auto 0}
.choice .btn{min-height:56px;font-size:17px;border-radius:14px}
.g-select{width:100%;min-height:56px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--bg);font-size:17px;margin-bottom:12px}
.big{width:100%;min-height:56px;font-size:17px;border-radius:14px}
.done{text-align:center}
.tick{width:60px;height:60px;margin:0 auto 8px;display:block}
.tick circle{fill:none;stroke:var(--ok);stroke-width:2}
.tick path{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:0}
.animate .tick path{animation:draw .6s .15s ease-out both}
.animate .qrbox{animation:rise .5s .45s ease-out both}
@keyframes draw{from{stroke-dashoffset:40}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.entry.animate .qr{animation:rise .5s .3s ease-out both}
@media (prefers-reduced-motion:reduce){.entry.animate .qr{animation:none}}
@media (prefers-reduced-motion:reduce){.animate .tick path,.animate .qrbox{animation:none}}
.done h2{font-family:var(--display);font-size:30px;margin:0;font-weight:700}
.done p{margin:4px 0}
.counts{display:flex;margin:16px 0;border:1px solid var(--line);border-radius:12px}
.counts div{flex:1;padding:10px}
.counts div+div{border-inline-start:1px solid var(--line)}
.counts b{display:block;font-family:var(--display);font-size:28px;line-height:1.1}
.counts span{font-size:13px;color:var(--muted)}
.qrbox{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.qrbox h3{font-family:var(--display);font-size:22px;margin:0}
.qr{background:#fff;border-radius:14px;padding:14px;width:min(250px,80%);margin:12px auto;display:block;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:auto}
.qr-acts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (max-width:380px){.qr-acts{grid-template-columns:1fr}}
.g-foot{text-align:center;font-size:14px;color:var(--muted);margin-top:14px}
.linkbtn{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;padding:6px;font-weight:500}

/* ===== scan / check-in ===== */
.station{max-width:560px;margin:0 auto;padding:16px 16px 48px}
.station h1{font-family:var(--display);font-size:30px;margin:6px 0 4px}
.cam{position:relative;background:#120c15;border-radius:18px;overflow:hidden;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;margin:14px 0}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px}
.cam p{color:#ddd;padding:24px;text-align:center;position:absolute}
.manual{display:flex;gap:8px;margin-top:10px}
.manual input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-height:46px}
.ci{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:14px}
.ci .nm{font-family:var(--display);font-size:clamp(30px,7vw,40px);line-height:1.15;margin:0 0 4px;font-weight:700}
.ci dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.ci dt{font-size:13px;color:var(--muted)}
.ci dd{margin:0;font-size:20px;font-weight:600}
.checkin-btn{width:100%;min-height:76px;font-size:22px;border-radius:16px}
.already{background:var(--ok-soft);color:var(--ok);border-radius:16px;padding:18px;text-align:center}
.already b{display:block;font-size:22px;margin-bottom:6px}
.warn{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}

/* ===== wedding theme (guest pages): blush paper, embossed flowers, burgundy seal ===== */
body.themed{--bg:#EFE0D9;--card:#FBF6F3;--ink:#3A1520;--muted:#7A6066;--line:#E5D2CB;--gold:#660D23;--gold-soft:#F5E8E4;--grey-soft:#EFE4E0;--wine:#660D23;--wine-deep:#4F0618;color-scheme:light;background:var(--bg)}
body.themed::before{content:"";position:fixed;inset:0;z-index:-1;background:#EFE0D9 var(--paper) top center/600px auto repeat;pointer-events:none}
body.themed .arch{background:rgba(251,246,243,.95);border-color:#FFFFFF;box-shadow:inset 0 1px 0 #fff,0 2px 4px rgba(102,13,35,.06),0 16px 34px rgba(102,13,35,.10)}
body.themed .arch::before{border-color:#E7D5CE;opacity:1;box-shadow:inset 1px 1px 0 #fff,1px 1px 0 #fff}
body.themed .g-card{background:rgba(251,246,243,.95);border-color:#fff;box-shadow:0 10px 28px rgba(102,13,35,.08)}
body.themed .btn.primary{background:var(--wine);border-color:var(--wine);color:#FBF6F3}
body.themed .btn.primary:hover{background:var(--wine-deep)}
body.themed .names{color:var(--wine)}
body.themed .cd-grid div{background:rgba(245,232,228,.95);box-shadow:inset 1px 1px 0 #fff}
body.themed .cd-grid b{color:var(--wine)}
body.themed .tick circle,body.themed .tick path{stroke:var(--wine)}
body.themed .ready{color:var(--wine)}
body.themed .map-btn{border-color:#E5D2CB}
body.themed .g-select{background:#fff}
body.themed .g-foot,body.themed .below-label{color:var(--muted)}
.seal{display:block;width:150px;height:auto;margin:-38px auto 12px;filter:drop-shadow(0 2px 2px rgba(102,13,35,.12))}
.arch.entry .seal{width:110px;margin:-40px auto 8px}
@media (prefers-reduced-motion:no-preference){body.themed .seal{animation:sealIn .7s ease-out both}}
@keyframes sealIn{from{opacity:0;transform:scale(.9)}}

/* more burgundy: an equal partner to the ivory */
body.themed .arch::before{border:1.5px solid rgba(102,13,35,.55);box-shadow:inset 0 0 0 4px rgba(251,246,243,.95),inset 0 0 0 5px rgba(102,13,35,.28)}
body.themed .dear{color:var(--wine)}
body.themed .facts dd{color:var(--wine)}
body.themed .orn i{background:var(--wine);opacity:.6}
body.themed .g-top .btn.ghost{color:var(--wine);background:rgba(251,246,243,.85);border:1px solid rgba(102,13,35,.25)}
body.themed .cd-grid div{background:linear-gradient(180deg,#7A1630,#5A0A1E);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 10px rgba(79,6,24,.18)}
body.themed .cd-grid b{color:#FBF6F3}
body.themed .cd-grid span{color:rgba(251,246,243,.78)}
body.themed .cd-date{color:var(--wine)}
body.themed .g-card:not(.entry){background:linear-gradient(170deg,#741430,#560A1D);border-color:rgba(255,255,255,.18);color:#FBF6F3;box-shadow:0 14px 30px rgba(79,6,24,.22)}
body.themed .g-card:not(.entry) h2,body.themed .g-card:not(.entry) p{color:#FBF6F3}
body.themed .g-card:not(.entry) .muted{color:rgba(251,246,243,.75)}
body.themed .g-card:not(.entry) .g-select{background:#FBF6F3;color:var(--wine);border-color:transparent}
body.themed .g-card:not(.entry) .btn.primary{background:#FBF6F3;color:var(--wine);border-color:#FBF6F3}
body.themed .g-card:not(.entry) .btn.primary:hover{background:#fff}
body.themed .g-card:not(.entry) .btn.primary[disabled]{opacity:.55}
body.themed .g-card:not(.entry) .btn:not(.primary){background:transparent;color:#FBF6F3;border-color:rgba(251,246,243,.6)}
body.themed .g-card:not(.entry) .tick circle,body.themed .g-card:not(.entry) .tick path{stroke:#FBF6F3}
body.themed .g-card:not(.entry) .counts{border-color:rgba(251,246,243,.3)}
body.themed .g-card:not(.entry) .counts div+div{border-color:rgba(251,246,243,.3)}
body.themed .g-card:not(.entry) .counts span{color:rgba(251,246,243,.75)}
body.themed .g-card:not(.entry) [style*="color:var(--bad)"]{color:#FFD0DA !important}
body.themed .map-btn{border:1.5px solid rgba(102,13,35,.45)}
body.themed .map-btn small{color:var(--muted)}
body.themed .g-foot{color:var(--wine)}

/* ===== opening doors ===== */
.doors{position:fixed;inset:0;z-index:100;perspective:1800px;overflow:hidden;cursor:pointer;background:transparent}
.door{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;background-color:#EFE0D9;background-image:var(--paper);background-size:600px auto;background-repeat:repeat;backface-visibility:hidden;will-change:transform}
.door.l{left:0;transform-origin:left center;background-position:calc(50vw - 300px) 0;box-shadow:inset -10px 0 18px -12px rgba(79,6,24,.35)}
.door.r{right:0;transform-origin:right center;background-position:-300px 0;box-shadow:inset 10px 0 18px -12px rgba(79,6,24,.35)}
.door::after{content:"";position:absolute;inset:18px;border:1.5px solid rgba(102,13,35,.35);box-shadow:inset 0 0 0 4px rgba(251,246,243,.35),inset 0 0 0 5px rgba(102,13,35,.18);pointer-events:none}
.door.l::after{right:-2px;border-right:0}
.door.r::after{left:-2px;border-left:0}
.door img{position:absolute;top:50%;width:min(210px,52vw);height:auto;transform:translateY(-50%);filter:drop-shadow(0 6px 10px rgba(79,6,24,.28))}
.door.l img{right:0;transform:translate(50%,-50%)}
.door.r img{left:0;transform:translate(-50%,-50%)}
.doors .hint{position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--display);font-size:18px;color:#660D23;opacity:0;animation:hintIn .6s .5s ease-out forwards;z-index:2}
@keyframes hintIn{to{opacity:.8}}
.doors.open .hint{opacity:0;animation:none;transition:opacity .2s}
.doors.open .door.l{animation:doorL 2.5s cubic-bezier(.45,.05,.3,1) forwards}
.doors.open .door.r{animation:doorR 2.5s cubic-bezier(.45,.05,.3,1) forwards}
.doors.open{animation:doorsFade .55s 2.1s ease-out forwards}
.doors.crack .door.l img{animation:crackL .6s ease-out forwards}
.doors.crack .door.r img{animation:crackR .6s ease-out forwards}
@keyframes crackL{to{transform:translate(calc(50% - 4px),-50%) rotate(-2deg)}}
@keyframes crackR{to{transform:translate(calc(-50% + 4px),-50%) rotate(2deg)}}
@keyframes doorL{0%{transform:rotateY(0)}100%{transform:rotateY(-108deg)}}
@keyframes doorR{0%{transform:rotateY(0)}100%{transform:rotateY(108deg)}}
@keyframes doorsFade{to{opacity:0;visibility:hidden}}

/* ===== revision: date block, burgundy panel, more burgundy ===== */
.cd-dates{text-align:center}
.cd-day{margin:0;font-size:16px;font-weight:600}
.cd-day .sep{opacity:.55;margin:0 6px}
.cd-big{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:clamp(34px,9.5vw,46px);line-height:1.15;letter-spacing:1px}
.cd-hijri{margin:0 0 4px;font-size:14px}
.pin{display:inline-flex;color:var(--wine,#660D23)}
body.themed .arch{border:3px solid #660D23}
body.themed .inv{color:var(--wine)}
body.themed .facts{margin-top:16px}
body.themed .facts dt{color:rgba(102,13,35,.75)}
body.themed .cd{background:linear-gradient(165deg,#741430,#520A1C);border-radius:18px;padding:18px 14px 16px;margin:18px 0 4px;border:0;color:#FBF6F3;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 22px rgba(79,6,24,.22)}
body.themed .cd .cd-day,body.themed .cd .cd-big,body.themed .cd-date{color:#FBF6F3}
body.themed .cd .cd-hijri,body.themed .cd .cd-label{color:rgba(251,246,243,.82)}
body.themed .cd .cd-grid div{background:rgba(251,246,243,.12);border:1px solid rgba(251,246,243,.25);box-shadow:none}
body.themed .cd .cd-grid b{color:#FBF6F3}
body.themed .cd .cd-grid span{color:rgba(251,246,243,.82)}
body.themed .cd-top .cd{margin:0 0 4px}
/* ===== envelope reveal ===== */
.envo{position:fixed;inset:0;z-index:110;display:grid;place-items:center;align-content:center;gap:22px;background:#EFE0D9 var(--paper) top center/600px auto repeat;cursor:pointer}
.env{position:relative;width:min(300px,78vw);aspect-ratio:3/2;perspective:1200px;opacity:0;transform:scale(.9) translateY(10px);animation:envIn .7s .1s ease-out forwards}
@keyframes envIn{to{opacity:1;transform:none}}
.env-back{position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,#F1E2DB,#E7D3CB);box-shadow:0 22px 44px rgba(79,6,24,.30)}
.env-liner{position:absolute;inset:0;z-index:1;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#741430,#520A1C);clip-path:polygon(0 0,100% 0,50% 64%);opacity:0;transition:opacity .4s ease}
.envo.open .env-liner{opacity:1}
.env-card{position:absolute;left:8%;right:8%;bottom:5%;height:90%;z-index:2;border-radius:8px;background:#FBF6F3;border:1px solid #E5D2CB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:0;transition:transform 1.5s cubic-bezier(.22,.8,.25,1),opacity .25s ease}
.envo.open .env-card{opacity:1}
.env-card b{font-family:var(--display);color:#660D23;font-size:15px}
.env-card .qr-mini{width:46%;background:#fff;padding:4px;border-radius:4px}
.env-card .qr-mini svg{display:block;width:100%;height:auto}
.env-pocket{position:absolute;inset:0;z-index:3;border-radius:10px;background:linear-gradient(165deg,#FAF3EF,#EBD8D0);clip-path:polygon(0 28%,50% 66%,100% 28%,100% 100%,0 100%);box-shadow:inset 0 -2px 0 rgba(102,13,35,.15)}
.env-pocket::after{content:"";position:absolute;inset:0;border-radius:10px;border:2px solid rgba(102,13,35,.35)}
.env-flap{position:absolute;left:0;right:0;top:0;height:64%;z-index:4;transform-origin:top center;transform-style:preserve-3d;transition:transform 1.1s ease-in-out}
.env-flap i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden}
.env-flap .f{background:linear-gradient(180deg,#F8EFEB,#E9D6CE)}
.env-flap .b{background:linear-gradient(180deg,#741430,#520A1C);transform:rotateX(180deg)}
.env-seal{position:absolute;left:50%;top:62%;width:38%;z-index:5;transform:translate(-50%,-50%);transition:opacity .7s ease,transform .7s ease;filter:drop-shadow(0 4px 6px rgba(79,6,24,.3))}
.env-cap{margin:0;font-family:var(--display);font-size:20px;color:#660D23;opacity:0;transition:opacity .8s ease;text-align:center}
.envo.unseal .env-seal{opacity:0;transform:translate(-50%,-75%) scale(1.12)}
.envo.open .env-flap{transform:rotateX(180deg)}
.envo.behind .env-flap{z-index:1}
.envo.rise .env-card{transform:translateY(-58%)}
.envo.rise .env-cap{opacity:1}
.envo.out{animation:envOut .6s ease forwards}
@keyframes envOut{to{opacity:0;visibility:hidden}}

.selbar[hidden]{display:none}

  async function onClick(e) {

    const f = e.target.closest("[data-f]"); if (f) { filter = f.dataset.f; renderOverview(); renderList(); return; }
    const a = e.target.closest("[data-a]");
    if (a) { const x = a.dataset.a; if (x === "add") editDialog(); if (x === "import") importDialog(); if (x === "settings") settingsDialog(); if (x === "export") exportReport(a); if (x === "signout") S.sb.auth.signOut(); if (x === "staff") staffDialog(); if (x === "helpers") helpersDialog(); if (x === "log") logDialog(); if (x === "select") { selMode = !selMode; if (!selMode) sel.clear(); renderList(); renderSelBar(); return; } if (x === "send") sendQueue(); if (x === "auto") autoSendDialog(); return; }
    const r = e.target.closest("[data-r]"); if (!r) return;
    const tok = r.closest("[data-tok]").dataset.tok, inv = S.invites.get(tok); if (!inv) return;
    const d = r.closest("details"); if (d) d.removeAttribute("open");

        case "link": if (await copyText(linkFor(inv))) toast(t("linkCopied")); break;
        case "wa": markSent(inv); break;
        case "resend": resendDialog(inv); break;
        case "unsent": await patchInvite(tok, { sentAt: null }); toast(t("unsentDone")); break;
        case "marksent": await patchInvite(tok, { sentAt: new Date().toISOString() }); toast(t("sentDone")); break;
        case "qr": deliver(`${inv.id}-qr.png`, await qrPngBlob(inv)); break;
        case "preview": location.hash = `#/preview/${inv.token}`; break;
        case "checkin": location.hash = `#/checkin/${inv.token}`; break;
        case "edit": editDialog(inv); break;
        case "reset": if (await confirmDialog(t("confirmReset", { name: inv.name }), t("resetRsvp"))) { await patchInvite(tok, { rsvp: null }); toast(t("resetDone")); } break;
        case "undo": if (await confirmDialog(t("confirmUndo", { name: inv.name }), t("undoCheckin"))) { const { error } = await S.sb.rpc("ci_undo", { p_token: tok, p_count: null, p_via: "dashboard" }); if (error) throw error; S.invites.set(tok, { ...inv, arrived: 0, checkedInAt: null }); refresh(); toast(t("undoDone")); } break;
        case "del": if (await confirmDialog(t("confirmDelete", { name: inv.name }), t("del"), true)) { await removeInvite(tok); toast(t("deleted")); } break;

function sendQueue(includeSent, kind) {

    clearInterval(tick);

      openDialog(`<h2>${t("q_title")}</h2>${kindPicker(kind)}<p>${kind === "invite" ? t("q_none") : t("q_noneRem")}</p><div class="dlg-acts">${kind === "invite" ? "" : `<button class="btn" data-x="all">${t("q_inclRecent")}</button>`}<button class="btn primary" data-x="c">${t("q_close")}</button></div>`, d => {

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 0;font-size:14px">
        <label style="display:flex;gap:6px;align-items:center">${t("q_batch")} <select id="q-batch" style="min-height:34px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">${[10, 25, 50].map(n => `<option value="${n}" ${n === batch ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <span class="muted">${t("q_inBatch", { k: inBatch + 1, n: batch })}</span>
      </div>
      ${lastTok && S.invites.has(lastTok) && S.invites.get(lastTok).sentAt ? `<p style="margin:10px 0 0;font-size:14px"><button class="linkbtn" data-x="undo" style="padding:0">${esc(t("q_undoSent", { name: S.invites.get(lastTok).name }))}</button></p>` : ""}
      <div class="q-card"><b>${esc(inv.name)}</b>

      const btn = $("#q-open", d);
      if (wait) tick = setInterval(() => {
        const s = Math.max(0, Math.ceil((coolUntil - Date.now()) / 1000));
        if (!document.body.contains(btn)) { clearInterval(tick); return; }
        if (s > 0) $("#q-lbl", d).textContent = t("q_wait", { s });
        else { clearInterval(tick); btn.classList.remove("cooling"); btn.removeAttribute("aria-disabled"); btn.removeAttribute("tabindex"); $("#q-lbl", d).textContent = label; }
      }, 250);
      btn.addEventListener("click", e => {

        pos++; inBatch++; coolUntil = Date.now() + PAUSE; setTimeout(show, 400);
      });
    });
  };
  show();

function autoSendDialog() {
  let side = "all", count = 25, running = false, stopFlag = false, waitTimer = 0, wakeUp = null, kind = "invite";
  let pace = 5; try { pace = +localStorage.getItem("auto-pace") || 5; if (pace === 7) pace = 5; } catch (e) {}
  const pick = () => [...S.invites.values()].filter(i => eligible(i, kind, false) && waNumber(i.phone) && (side === "all" || i.side === side)).sort((a, b) => String(a.id).localeCompare(String(b.id)));
  const sleep = (sec, onTick) => new Promise(res => { let left = sec; onTick && onTick(left); wakeUp = res; waitTimer = setInterval(() => { left--; onTick && onTick(left); if (left <= 0 || stopFlag) { clearInterval(waitTimer); res(); } }, 1000); });
  const guard = e => { if (running) { e.preventDefault(); e.returnValue = ""; } };
  const setup = () => {
    const n = pick().length, total = count === 0 ? n : Math.min(count, n);
    openDialog(`<h2>${t("as_title")}</h2>
      <p class="muted" style="margin-top:0">${t("as_help")}</p>
      ${kindPicker(kind, "as-kind")}
      <label class="field"><span>${t("side")}</span><select id="as-side"><option value="all">${t("allSides")}</option>${SIDES.map(sd => `<option value="${sd}" ${side === sd ? "selected" : ""}>${t("side_" + sd)}</option>`).join("")}</select></label>
      <label class="field"><span>${t("as_count")}</span><select id="as-count">${[3, 10, 25, 50, 0].map(v => `<option value="${v}" ${count === v ? "selected" : ""}>${v === 0 ? t("all") : v}</option>`).join("")}</select></label>
      <label class="field"><span>${t("as_pace")}</span><select id="as-pace"><option value="5" ${pace === 5 ? "selected" : ""}>${t("as_pacePaid")}</option><option value="3" ${pace === 3 ? "selected" : ""}>${t("as_paceFast")}</option><option value="65" ${pace >= 60 ? "selected" : ""}>${t("as_paceTrial")}</option></select>${pace === 3 ? `<small style="color:var(--amber)">${t("as_fastWarn")}</small>` : ""}</label>
      <div class="notice gold" style="font-size:14px">${t("as_ready", { n: total })} ${t("as_eta", { m: Math.max(1, Math.ceil(total * pace / 60)) })}</div>
      <div class="dlg-acts"><button class="btn" data-x="c">${t("cancel")}</button><button class="btn gold" data-x="go" ${total ? "" : "disabled"}>${t("as_start", { n: total })}</button></div>`, d => {
      $('[data-x="c"]', d).onclick = closeDialog;
      $("#as-side", d).onchange = e => { side = e.target.value; setup(); };
      $("#as-kind", d).onchange = e => { kind = e.target.value; setup(); };
      $("#as-count", d).onchange = e => { count = +e.target.value; setup(); };
      $("#as-pace", d).onchange = e => { pace = +e.target.value; try { localStorage.setItem("auto-pace", String(pace)); } catch (x) {} setup(); };
      $('[data-x="go"]', d).onclick = e => { if (running) return; e.currentTarget.disabled = true; run(pick().slice(0, count === 0 ? undefined : count)); };
    });
  };
  const run = async list => {
    running = true; stopFlag = false; window.addEventListener("beforeunload", guard);
    let sent = 0, failed = 0, inARow = 0; const log = [];
    openDialog(`<h2>${t("as_title")}</h2>
      <div class="q-prog"><i id="as-bar" style="width:0%"></i></div>
      <p id="as-status" style="margin:6px 0 2px;font-weight:600"></p>
      <p id="as-wait" class="muted" style="margin:0 0 8px;font-size:14px"></p>
      <p class="muted" style="margin:0 0 8px;font-size:13px">${t("as_keepOpen")}</p>
      <div id="as-log" class="report" style="max-height:200px;color:var(--ink)"></div>
      <div class="dlg-acts"><button class="btn" data-x="stop" style="color:var(--bad);border-color:var(--bad)">${t("as_stop")}</button></div>`, d => {
      $('[data-x="stop"]', d).onclick = () => { stopFlag = true; clearInterval(waitTimer); wakeUp && wakeUp(); };
    });
    const ui = () => { const bar = $("#as-bar"); if (bar) bar.style.width = ((sent + failed) / list.length * 100) + "%"; const st = $("#as-status"); if (st) st.textContent = t("as_progress", { s: sent, n: list.length, f: failed }); const lg = $("#as-log"); if (lg) lg.innerHTML = log.slice(-60).reverse().map(x => `<div>${x}</div>`).join(""); };
    const waitMsg = s => { const w = $("#as-wait"); if (w) w.textContent = s > 0 ? t("as_next", { s }) : ""; };
    let stopReason = "";
    for (let k = 0; k < list.length && !stopFlag; k++) {
      const inv = list[k];
      const st = $("#as-status"); if (st) st.textContent = t("as_sending", { name: inv.name, i: k + 1, n: list.length });
      let tries = 0, done = false; const started = Date.now();
      while (!done && !stopFlag) {
        let res;
        try {
          const { data, error } = await S.sb.functions.invoke(FN_WA_SEND, { body: { to: waNumber(inv.phone), text: messageFor(inv, kind) } });
          if (error) {
            let j = null, st = error.context && error.context.status;
            try { j = await error.context.json(); } catch (e) {}
            if (j && j.ok === false) res = j;
            else res = { ok: false, error: "NO_FUNCTION", detail: [st ? "HTTP " + st : "", error.name || "", (j && (j.message || j.msg || j.code)) || error.message || ""].filter(Boolean).join(" · ") };
          } else res = data;
        } catch (e) { res = { ok: false, error: "NETWORK" }; }
        if (res && res.ok) {
          sent++; inARow = 0; done = true; log.push(`✅ ${esc(inv.id)} ${esc(inv.name)}`);
          try { await markDone(inv, kind); } catch (e) {}
        } else if (res && res.error === "RATE_LIMIT" && tries < 3) {
          tries++; await sleep((res.retry_after || 60) + 3, waitMsg);
        } else if (res && ["NOT_ALLOWED", "NOT_SIGNED_IN", "NO_KEY", "NO_FUNCTION"].includes(res.error)) {
          stopReason = t("as_err_" + res.error) + (res.detail ? " (" + res.detail + ")" : ""); stopFlag = true; done = true;
        } else {
          failed++; inARow++; done = true; log.push(`❌ ${esc(inv.id)} ${esc(inv.name)}: ${esc((res && (res.detail || res.error)) || "")}`);
          if (inARow >= 3) { stopReason = t("as_err_3"); stopFlag = true; }
        }
      }
      ui();
      // the pace is counted from when this message started, so the gap between messages is exactly the chosen pace
      const left = Math.ceil(pace - (Date.now() - started) / 1000);
      if (!stopFlag && k < list.length - 1 && left > 0) await sleep(left, waitMsg);
    }
    running = false; window.removeEventListener("beforeunload", guard); waitMsg(0); refresh();
    const bar = $("#as-bar"); if (bar) bar.style.width = "100%";
    const st = $("#as-status"); if (st) st.textContent = (stopReason ? stopReason + " " : "") + t("as_finished", { s: sent, f: failed });
    const acts = $("#dlg .dlg-acts"); if (acts) { acts.innerHTML = `<button class="btn primary" data-x="close">${t("q_close")}</button>`; $('[data-x="close"]').onclick = closeDialog; }
  };
  setup();
}

function readReport(aoa) {

function planRestore(rows, bad) {

  const ok = [], have = [], dupList = [];

const numOf = v => { const m = asciiDigits(String(v ?? "")).trim().match(/\d+(\.0+)?/); return m ? Number(m[0]) : NaN; };
const cleanRows = aoa => { const rowNo = []; const rows = (aoa || []).filter((r, i) => { const keep = r && r.some(c => String(c ?? "").trim() !== ""); if (keep) rowNo.push(i + 1); return keep; }); return { rows, rowNo }; };

function guessColumns(aoa) {
  const { rows } = cleanRows(aoa); if (!rows.length) return { idx: {}, header: true };
  const head = rows[0].map(h => String(h ?? "").toLowerCase()), idx = {};
  head.forEach((s, i) => { for (const k of ["extra", "seats", "phone", "notes", "name"]) if (idx[k] == null && HEAD[k].some(w => s.includes(w))) { idx[k] = i; break; } });

    const numeric = vals.length ? vals.filter(v => /^\d{1,2}$/.test(asciiDigits(v))).length / vals.length : 0;
    if (numeric >= .6 && idx.extra == null && idx.seats != null && c !== idx.phone) { idx.extra = c; used.add(c); }
    else if (numeric < .6 && idx.notes == null) { idx.notes = c; used.add(c); }

function parseRows(aoa, side, map, mode) {

  const g = map || guessColumns(aoa), idx = g.idx, start = g.header ? 1 : 0;
  const cell = (row, k) => idx[k] != null && idx[k] !== "" ? String(row[idx[k]] ?? "").trim() : "";
  const ok = [], bad = [];
  for (let r = start; r < all.length; r++) {
    const row = all[r], name = cell(row, "name");

    const cards = numOf(cell(row, "seats")), extraRaw = cell(row, "extra"), extra = extraRaw ? numOf(extraRaw) : 0;
    const seats = (Number.isInteger(cards) ? cards : 0) + (Number.isInteger(extra) ? extra : 0);
    if (!name) { bad.push(`${t("row")} ${rowNo[r]}: ${t("why_name")}`); continue; }
    if (!Number.isInteger(seats) || seats < 1 || (extraRaw && !Number.isInteger(extra))) { bad.push(`${t("row")} ${rowNo[r]}: ${t("why_seats")}`); continue; }
    const phoneRaw = asciiDigits(cell(row, "phone"));
    if (phoneRaw && normPhone(phoneRaw).length < 9) { bad.push(`${t("row")} ${rowNo[r]}: ${t("why_phoneBad")}`); continue; }
    ok.push({ row: rowNo[r], name, seats: Math.min(seats, 99), phone: phoneRaw, notes: cell(row, "notes") });

// "update" mode: match each row to the family already imported from the same file (same order, same name) and
// refresh its note and number of entry cards. Phone numbers already saved are never removed.
function planUpdate(rows, bad) {
  const list = [...S.invites.values()].sort((a, b) => String(a.id).localeCompare(String(b.id)));
  let p = 0; const upd = [], miss = [];
  for (const x of rows) {
    let hit = -1;
    for (let k = p; k < Math.min(list.length, p + 15); k++) if (normAr(list[k].name) === normAr(x.name)) { hit = k; break; }
    if (hit < 0) { miss.push(x); continue; }

function countdownParts(iso) {
  const ms = new Date(iso).getTime() - Date.now(); if (isNaN(ms) || ms <= 0) return null;
  const s = Math.floor(ms / 1000);
  return { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
}
const cdNum = n => String(n).padStart(2, "0");   // countdown: always English numerals
const toArDigits = s => String(s).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const digits = s => S.settings.numStyle === "ar" ? toArDigits(asciiDigits(s)) : asciiDigits(s);
const RIYADH = { timeZone: "Asia/Riyadh" };
function numDate(iso) {   // 11/11/2026 (Riyadh day)
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { ...RIYADH, day: "2-digit", month: "2-digit", year: "numeric" }).formatToParts(new Date(iso)).map(x => [x.type, x.value]));

const sealImg = () => `<img class="seal" src="${SEAL_SRC}" alt="" aria-hidden="true">`;
function playDoors(token, force) {
  try { if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) {}
  let seen = false; try { seen = localStorage.getItem("doors:" + token) === "1"; } catch (e) {}
  if (seen && !force) return;
  try { localStorage.setItem("doors:" + token, "1"); } catch (e) {}
  const el = document.createElement("div"); el.className = "doors"; el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="door l"><img src="${SEAL_SRC}" alt=""></div><div class="door r"><img src="${SEAL_SRC}" alt=""></div><p class="hint">${LANG === "ar" ? "اضغطوا للفتح" : "Tap to open"}</p>`;
  document.body.appendChild(el);
  let started = false;
  const open = () => { if (started) return; started = true; el.classList.add("crack"); setTimeout(() => el.classList.add("open"), 600); setTimeout(() => el.remove(), 3400); };
  el.addEventListener("click", open);
  setTimeout(open, 1500);
}
function envelopeInner(link) {
  return `<div class="env-back"></div><div class="env-liner"></div>
      <div class="env-card"><b>${t("g_qrTitle")}</b><div class="qr-mini">${qrSvg(link)}</div></div>
      <div class="env-pocket"></div><div class="env-flap"><i class="f"></i><i class="b"></i></div>`;
}
const envelopeStatic = link => `<div class="env-stage"><div class="env env-open">${envelopeInner(link)}</div></div>`;
// dropdown wording: 1 = entry card, 2 = companion, 3 = two companions, 4+ = n companions
function countLabel(i, l = LANG) {
  if (l !== "ar") return i === 1 ? "Entry card, no companion" : i === 2 ? "Entry card with 1 companion" : `Entry card with ${i - 1} companions`;
  if (i === 1) return "بطاقة دخول دون مرافق"; if (i === 2) return "بطاقة دخول مع مرافق"; if (i === 3) return "بطاقة دخول مع مرافقان";
  const n = i - 1, d = String(n).replace(/\d/g, x => "٠١٢٣٤٥٦٧٨٩"[x]);
  return n <= 10 ? `بطاقة دخول مع ${d} مرافقين` : `بطاقة دخول مع ${d} مرافقًا`;
}
// small themed pop-up after a reply (about 2.5 s), then continue
function showReplyPop(msg, then) {
  const el = document.createElement("div"); el.className = "rpop"; el.setAttribute("role", "status");
  el.innerHTML = `<div><svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="27"/><path d="M18 31l8 8 16-17"/></svg><p>${esc(msg)}</p></div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("on"));
  let done = false;
  const finish = () => { if (done) return; done = true; el.classList.remove("on"); setTimeout(() => el.remove(), 350); then && then(); };
  setTimeout(finish, 2500); el.onclick = finish;
}
function playEnvelope(link) {
  try { if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) {}
  const el = document.createElement("div"); el.className = "envo"; el.setAttribute("aria-hidden", "true");
  el.innerHTML = `<div class="env">${envelopeInner(link)}
      <img class="env-seal" src="${SEAL_SRC}" alt=""></div>
    <p class="env-cap">${t("g_confTitle")}</p>`;
  document.body.appendChild(el);
  const T = [];
  const at = (ms, fn) => T.push(setTimeout(fn, ms));
  const end = () => { T.forEach(clearTimeout); el.classList.add("out"); setTimeout(() => el.remove(), 650); };
  at(800, () => el.classList.add("unseal"));
  at(1450, () => el.classList.add("open"));
  at(2500, () => el.classList.add("behind"));
  at(2550, () => el.classList.add("rise"));
  at(4300, end);
  el.addEventListener("click", end);
}

// Arabic-friendly text normalising for contact search (أ/إ/آ → ا, ة → ه, ى → ي, no tashkeel)
const normAr = s => asciiDigits(String(s || "")).toLowerCase().replace(/[ً-ٰٟـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/ؤ/g, "و").replace(/ئ/g, "ي").replace(/\s+/g, " ").trim();
// read a .vcf contacts file (iPhone / Android export) into [{name, tels:[]}]
function parseVcf(text) {
  const out = [];
  const lines = String(text || "").replace(/\r\n?/g, "\n").replace(/=\n/g, "\u0000QP\u0000").replace(/\n[ \t]/g, "").split("\n");
  const qp = v => { try { return decodeURIComponent(v.replace(/\u0000QP\u0000/g, "").replace(/=([0-9A-F]{2})/gi, "%$1")); } catch (e) { return v; } };
  const unesc = v => v.replace(/\\n/gi, " ").replace(/\\([,;\\])/g, "$1");
  let cur = null;
  for (let ln of lines) {
    ln = ln.replace(/\u0000QP\u0000/g, "");
    const up = ln.toUpperCase();
    if (up.startsWith("BEGIN:VCARD")) { cur = { fn: "", n: "", org: "", tels: [] }; continue; }
    if (up.startsWith("END:VCARD")) { if (cur) { const name = (cur.fn || cur.n || cur.org || "").trim(); if (cur.tels.length) out.push({ name: name || cur.tels[0], tels: [...new Set(cur.tels)] }); } cur = null; continue; }
    if (!cur) continue;
    const i = ln.indexOf(":"); if (i < 0) continue;
    const key = ln.slice(0, i), K = key.toUpperCase().replace(/^ITEM\d+\./, ""); let val = ln.slice(i + 1);
    if (/QUOTED-PRINTABLE/i.test(key)) val = qp(val);
    val = unesc(val);
    if (K === "FN" || K.startsWith("FN;")) cur.fn = val;
    else if (K === "N" || K.startsWith("N;")) cur.n = val.split(";").filter(Boolean).reverse().join(" ");
    else if (K === "ORG" || K.startsWith("ORG;")) cur.org = val.replace(/;/g, " ");
    else if (K === "TEL" || K.startsWith("TEL;")) { const v = asciiDigits(val.replace(/^tel:/i, "")).trim(); if (v.replace(/\D/g, "").length >= 7) cur.tels.push(v); }
  }
  return out;
}

function findInvite(text) {
  let s = String(text || "").trim(); if (!s) return null;
  try { const u = new URL(s); const qi = u.searchParams.get("i"); if (qi) s = qi; else { const parts = u.pathname.split("/").filter(Boolean); if (parts.length) s = parts[parts.length - 1]; } } catch (e) {
    const parts = s.split(/[\/#?]/).filter(Boolean); if (parts.length) s = parts[parts.length - 1];
  }
  if (S.invites.has(s)) return S.invites.get(s);
  const low = s.toLowerCase(), num = parseInt(low.replace(/\D/g, ""), 10);
  for (const i of S.invites.values()) { if (String(i.id).toLowerCase() === low) return i; if (num && /^(inv-?)?\d+$/.test(low) && parseInt(String(i.id).replace(/\D/g, ""), 10) === num) return i; }
  return null;
}
function stationTop() {
  if (S.role === "staff") return `<div class="g-top"><span class="muted" style="font-size:14px">${esc(t("staffMode"))}${S.staffName ? " | " + esc(S.staffName) : ""}</span><span style="display:flex;gap:6px">${langBtn()}<button class="btn ghost sm" data-ci="signout">${t("signOut")}</button></span></div>`;
  return `<div class="g-top"><a class="btn ghost sm" href="./#/">${ICON.back}${t("back")}</a>${langBtn()}</div>`;
}
document.addEventListener("click", e => { if (e.target.closest('[data-ci="signout"]')) S.sb.auth.signOut(); });
function ScanView() {
  let stream = null, raf = 0, alive = true;
  function mount() {
    ensureAll();
    app.innerHTML = `<main class="station">${stationTop()}
      <h1>${t("c_title")}</h1><p class="muted" style="margin:0">${t("c_help")}</p>
      <div class="cam" id="cam"><video id="vid" playsinline muted></video><div class="frame" aria-hidden="true"></div><p id="camMsg" hidden></p></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn" id="startCam">${ICON.scan}${t("c_startCam")}</button>
        <label class="btn" style="cursor:pointer">${ICON.img}${t("c_photo")}<input type="file" id="photo" accept="image/*" capture="environment" class="sr"></label>
      </div>
      <form class="manual" id="manual"><input id="manualIn" placeholder="${t("c_manual")}" dir="ltr" autocomplete="off" aria-label="${t("c_manual")}"><button class="btn primary">${t("c_find")}</button></form>
    </main>`;
    $("#startCam").onclick = start;
    $("#photo").onchange = scanPhoto;
    $("#manual").onsubmit = e => { e.preventDefault(); go($("#manualIn").value); };
    start();
  }
  function camMsg(m) { const p = $("#camMsg"); if (p) { p.hidden = !m; p.textContent = m || ""; } }
  async function start() {
    stop();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      if (!alive) { stop(); return; }
      const v = $("#vid"); v.srcObject = stream; await v.play(); camMsg(""); loop();
    } catch (e) { camMsg(t("c_cameraOff")); }
  }
  const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
  function loop() {
    const v = $("#vid"); if (!alive || !v) return;
    if (v.readyState >= 2 && v.videoWidth) {
      const scale = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight));
      cv.width = v.videoWidth * scale; cv.height = v.videoHeight * scale; cx.drawImage(v, 0, 0, cv.width, cv.height);
      const code = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: "dontInvert" });
      if (code && code.data && !looking && code.data !== lastBad) { go(code.data, true); }
    }
    raf = requestAnimationFrame(loop);
  }
  let lastBad = "";
  let looking = false;
  async function go(text, fromCam) {
    if (looking) return false; looking = true;
    let code = String(text || "").trim();
    try { const u = new URL(code); const qi = u.searchParams.get("i"); if (qi) code = qi; else { const parts = u.pathname.split("/").filter(Boolean); if (parts.length) code = parts[parts.length - 1]; } } catch (e) {}
    const { data, error } = await S.sb.rpc("ci_lookup", { p_code: asciiDigits(code), p_via: fromCam === true ? "scan" : fromCam === "photo" ? "scan" : "manual" });
    looking = false;
    if (error || !data) { if (fromCam !== true || text !== lastBad) toast(error ? t("writeErr") : t("c_notFound")); lastBad = text; return false; }
    S.ci = S.ci || {}; S.ci[data.token] = data;
    if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
    location.hash = "#/checkin/" + data.token; return true;
  }
  function scanPhoto(e) {
    const f = e.target.files[0]; if (!f) return; const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1400 / Math.max(img.width, img.height)); cv.width = img.width * scale; cv.height = img.height * scale;
      cx.drawImage(img, 0, 0, cv.width, cv.height); const code = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
      URL.revokeObjectURL(img.src); if (code && code.data) go(code.data, "photo"); else toast(t("c_noQr"));
    };
    img.src = URL.createObjectURL(f); e.target.value = "";
  }
  function stop() { cancelAnimationFrame(raf); if (stream) { stream.getTracks().forEach(tr => tr.stop()); stream = null; } }
  function unmount() { alive = false; stop(); }
  return { mount, unmount, update() {} };
}

/* ======================= CHECK-IN ======================= */
function CheckinView(r) {
  let busy = false, flash = "";
  function mount() { app.addEventListener("click", onClick); update(); if (!(S.ci && S.ci[r.token])) load(); }
  function unmount() { app.removeEventListener("click", onClick); }
  async function load() {
    const { data, error } = await S.sb.rpc("ci_lookup", { p_code: r.token, p_via: "scan" });
    S.ci = S.ci || {}; S.ci[r.token] = error ? { error: true } : (data || { missing: true }); update();
  }
  function update() {
    const top = stationTop(), c = S.ci && S.ci[r.token];
    const next = `<p style="margin-top:14px"><a class="btn primary big" href="#/scan">${ICON.scan}${t("c_next")}</a></p>`;
    if (!c) { app.innerHTML = `<main class="station">${top}<div class="loading">${t("loading")}</div></main>`; return; }
    if (c.error || c.missing) { app.innerHTML = `<main class="station">${top}<div class="ci"><p class="nm" style="font-size:26px">${c.error ? t("writeErr") : t("c_notFound")}</p></div>${next}</main>`; return; }
    const a = c.rsvp_count, m = c.max_in, left = m - c.arrived, full = left <= 0;
    const rsvpSt = a == null ? "noReply" : a === 0 ? "declined" : a < c.seats ? "partial" : "confirmed";
    const warn = a == null ? t("c_noRsvp") : a === 0 ? t("c_declined") : "";
    let action;
    if (full) action = `<div class="already"><b>${t("ci_full", { n: m })}</b>${c.checked_in_at ? `<div>${t("ci_first")}: ${esc(fmtTime(c.checked_in_at))}</div>` : ""}${c.last_at ? `<div>${t("ci_last")}: ${esc(fmtTime(c.last_at))}</div>` : ""}</div>`;
    else {
      const some = []; for (let k = 1; k < left && k <= 8; k++) some.push(`<button class="btn" data-c="add" data-n="${k}" ${busy ? "disabled" : ""} style="min-width:56px;min-height:52px;font-size:18px">+${k}</button>`);
      action = `${warn ? `<div class="warn">${esc(warn)}${a == null || a === 0 ? `<br><small>${esc(t("ci_maxNote", { n: m }))}</small>` : ""}</div>` : ""}
        <button class="btn gold checkin-btn" data-c="all" ${busy ? "disabled" : ""}>${ICON.scan}${t("ci_all", { n: left })}</button>
        ${some.length ? `<p class="muted" style="margin:14px 0 8px;font-size:14px">${t("ci_some")}</p><div style="display:flex;flex-wrap:wrap;gap:8px">${some.join("")}</div>` : ""}`;
    }
    app.innerHTML = `<main class="station">${top}<div class="ci">
      <p class="muted" style="margin:0">${t("inviteId")} ${esc(c.inv_id)} ${c.side ? sidePill(c.side) : ""}</p>
      <p class="nm">${esc(c.name)}</p>
      ${flash ? `<div class="already" style="margin:8px 0">${esc(flash)}</div>` : ""}
      <dl>
        <div><dt>${t("reservedSeats")}</dt><dd>${c.seats}</dd></div>
        <div><dt>${t("confirmedAtt")}</dt><dd>${a ?? "–"}</dd></div>
        <div><dt>${t("c_status")}</dt><dd>${rsvpSt === "noReply" ? `<span class="pill draft">${t("noReply")}</span>` : pill(rsvpSt)}</dd></div>
        <div><dt>${t("c_check")}</dt><dd><b style="font-size:22px">${esc(t("ci_of", { a: c.arrived, m }))}</b></dd></div>
      </dl>${action}
      ${c.arrived > 0 ? `<p style="margin:14px 0 0;text-align:center"><button class="linkbtn" data-c="undo" ${busy ? "disabled" : ""}>${t("ci_undo1")}</button></p>` : ""}
      </div>${next}</main>`;
  }
  async function act(fn, args, msg) {
    busy = true; flash = ""; update();
    const { data, error } = await S.sb.rpc(fn, { p_token: r.token, p_via: "scan", ...args });
    busy = false;
    if (error) { if (/ALL_IN/.test(error.message || "")) { toast(t("ci_allIn")); await load(); return; } writeFailed(error); update(); return; }
    S.ci[r.token] = data; flash = msg(data);
    if (S.invites.has(r.token)) { const cur = S.invites.get(r.token); S.invites.set(r.token, { ...cur, arrived: data.arrived, checkedInAt: data.checked_in_at }); }
    if (navigator.vibrate) try { navigator.vibrate(40); } catch (e) {}
    update();
  }
  function onClick(e) {
    const b = e.target.closest("[data-c]"); if (!b || busy) return;
    if (b.dataset.c === "all") act("ci_admit", { p_count: null }, d => t("ci_of", { a: d.arrived, m: d.max_in }));
    if (b.dataset.c === "add") act("ci_admit", { p_count: +b.dataset.n }, d => t("ci_of", { a: d.arrived, m: d.max_in }));
    if (b.dataset.c === "undo") act("ci_undo", { p_count: 1 }, () => t("ci_undone"));
  }
  return { mount, update, unmount };
}

init();
</script>
